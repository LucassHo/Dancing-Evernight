<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Evernight Dancing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  img {
    width: 100%;
    height: 100%;
    display: block;
  }
  #drag-region {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-app-region: drag; /* Allows dragging */
  }
</style>
</head>
<body>
<img id="drag-region"src="Evernight.gif" />
</body>
</html>
