<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Evernight Dancing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  img {
    width: 100%;
    height: 100%;
    display: block;
  }
  #gif {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-app-region: drag; /* Allows dragging */
  }
</style>
</head>
<body>
<img id="gif"src="" />
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const gifName = urlParams.get('gif');

  if (gifName) {
    document.getElementById('gif').src = `../assets/gifs/${gifName}`;
  } else {
    console.error('No GIF name found in URL parameters')
  }
</script>
</body>
</html>
